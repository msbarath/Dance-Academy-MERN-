[build]
  command   = "npm run build"
  publish   = "build"

[build.environment]
  NODE_VERSION = "20"
  CI           = "false"
  NPM_FLAGS    = "--legacy-peer-deps"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"
